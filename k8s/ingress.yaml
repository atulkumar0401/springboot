apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: springboot-demo
  namespace: springboot-demo
spec:
  ingressClassName: nginx
  rules:
    - host: springboot-demo.dev-oke2.noqodi.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: springboot-demo
                port:
                  number: 8080
